<body class="gb-shell-page">
  <h1 class="gb-visually-hidden">Go-burger</h1>
  <div class="gb-shell" id="gbShell">
    <header class="gb-topbar">
      <button class="gb-brand" id="brandHome" type="button" aria-label="Ir para o modo cliente">
        <span class="gb-mark">🍔</span>
        <span class="gb-brand-copy">
          <strong>Go-burger</strong>
          <small id="brandSubtitle">HAMBURGUERIAS EM UM SÓ APP</small>
        </span>
      </button>

      <nav class="gb-modes" aria-label="Modos do aplicativo">
        <button class="gb-mode active" id="btnExplorar" type="button" data-route="explorar">
          <i class="fa-solid fa-compass"></i>
          <span>Explorar</span>
        </button>
        <button class="gb-mode" id="btnCliente" type="button" data-mode="cliente">
          <i class="fa-solid fa-burger"></i>
          <span>Pedir</span>
        </button>

        <button class="gb-mode hidden" id="btnAdmin" type="button" data-mode="admin">
          <i class="fa-solid fa-store"></i>
          <span id="btnAdminLabel">Painel da loja</span>
        </button>

        <button class="gb-mode hidden" id="btnEntregador" type="button" data-mode="entregador">
          <i class="fa-solid fa-motorcycle"></i>
          <span>Entregador</span>
        </button>

        <button class="gb-mode gb-mode-super hidden" id="btnSuperAdmin" type="button" data-mode="superadmin">
          <i class="fa-solid fa-shield-halved"></i>
          <span>Super Admin</span>
        </button>
      </nav>

      <div class="gb-actions">
        <button class="gb-theme-toggle" id="gbTheme" data-gb-theme-toggle type="button" aria-label="Ativar modo escuro" title="Ativar modo escuro"><i class="fa-regular fa-moon"></i></button>
        <button class="gb-more-btn" id="btnMore" type="button" aria-haspopup="menu" aria-expanded="false" title="Mais opções">
          <i class="fa-solid fa-ellipsis"></i>
        </button>
        <div class="gb-more-menu hidden" id="gbMoreMenu" role="menu">
          <button type="button" data-shell-route="explorar"><i class="fa-solid fa-compass"></i><span><strong>Explorar hamburguerias</strong><small>Voltar ao marketplace</small></span></button>
          <button type="button" data-shell-route="pedidos"><i class="fa-solid fa-receipt"></i><span><strong>Meus pedidos</strong><small>Acompanhar histórico</small></span></button>
          <button type="button" data-shell-route="perfil"><i class="fa-solid fa-user"></i><span><strong>Minha conta</strong><small>Perfil, endereços e privacidade</small></span></button>
          <button type="button" data-shell-route="admin"><i class="fa-solid fa-store"></i><span><strong>Go-burger Parceiros</strong><small>Gerenciar hamburgueria</small></span></button>
          <button type="button" data-shell-route="entregador"><i class="fa-solid fa-motorcycle"></i><span><strong>Painel do entregador</strong><small>Rotas e entregas</small></span></button>
          <button type="button" data-shell-route="cadastro-entregador"><i class="fa-solid fa-id-card"></i><span><strong>Quero ser entregador</strong><small>Cadastro, documentos e análise</small></span></button>
          <button type="button" data-shell-route="ajuda"><i class="fa-solid fa-circle-question"></i><span><strong>Privacidade e ajuda</strong><small>Documentos da plataforma</small></span></button>
        </div>
      </div>

      <div class="gb-account">
        <span class="gb-dot" id="sessionDot" aria-hidden="true"></span>
        <div class="gb-account-copy">
          <strong id="sessionLabel">Visitante</strong>
          <small id="storeLabel">Faça login para continuar</small>
        </div>
      </div>
    </header>

    <main class="gb-stage">
      <div class="gb-loader hidden" id="gbLoader">
        <div class="gb-loader-mark">🍔</div>
        <strong>Go-burger</strong>
        <span>Preparando seu aplicativo...</span>
      </div>

      <iframe
        id="appFrame"
        class="gb-frame ready"
        title="Go-burger"
        src="../cliente/marketplace/market.html?v=62"
        allow="clipboard-read; clipboard-write; geolocation"
      ></iframe>
    </main>

    <div class="gb-toast" id="gbToast" role="status" aria-live="polite"></div>
  </div>
